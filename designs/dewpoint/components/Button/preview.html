<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{padding:24px;box-sizing:border-box}</style></head>

<p class="dp-cap">Large (47px)</p>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><button class="dp-btn dp-btn--secondary" >Try the demo</button><button class="dp-btn dp-btn--primary" >Get started<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="nudge-down"><path d="M12 4v11m-5-4 5 5 5-5M5 20h14"/></svg></button><button class="dp-btn dp-btn--accent" >Start free</button><button class="dp-btn dp-btn--outline-strong" >Read the notes</button><button class="dp-btn dp-btn--text" >Skip for now</button></div>
<br><p class="dp-cap">Compact (36px)</p>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><button class="dp-btn dp-btn--compact dp-btn--secondary has-icon" >Preview<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="nudge"><path d="M7 17 17 7M8 7h9v9"/></svg></button><button class="dp-btn dp-btn--compact dp-btn--primary" >Get started<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="nudge-down"><path d="M12 4v11m-5-4 5 5 5-5M5 20h14"/></svg></button><button class="dp-btn dp-btn--compact dp-btn--outline" >Sign in</button></div>
<br><p class="dp-cap">States: rest, hover, pressed, disabled (focus: tab to any button)</p>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><button class="dp-btn dp-btn--primary" >Rest</button><button class="dp-btn dp-btn--primary is-hover" >Hover</button><button class="dp-btn dp-btn--secondary is-hover" >Hover</button><button class="dp-btn dp-btn--primary" disabled>Disabled</button><button class="dp-btn dp-btn--secondary" disabled>Disabled</button></div>

<script>Dewpoint.init();</script>

</html>
