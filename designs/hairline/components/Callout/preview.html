<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Callout</title>
<style>body{padding:24px;box-sizing:border-box;background:var(--surface)} body{background:var(--surface-subtle)} .row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start} .row>*:nth-child(2){animation-delay:120ms} .row>*:nth-child(3){animation-delay:240ms}</style></head>
<body>
<div class="row">
  <div class="hl-callout hl-callout--enter"><span class="hl-orb hl-orb--sm"></span><div><span class="hl-label hl-label--sky">Goals</span><p class="hl-callout__text">Q3 goal is <strong>82% complete</strong>, two weeks early.</p></div></div>
  <div class="hl-callout hl-callout--enter"><span class="hl-orb hl-orb--sm hl-orb--coral"></span><div><span class="hl-label hl-label--blush">Budget review</span><p class="hl-callout__text">Two line items need a sign-off before Friday.</p></div></div>
  <div class="hl-callout hl-callout--enter"><div><span class="hl-label hl-label--highlighter">Handoff</span><p class="hl-callout__text">Designs are ready for <strong>engineering review</strong>.</p></div></div>
</div>
</body></html>
