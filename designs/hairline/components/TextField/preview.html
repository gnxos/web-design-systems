<!-- @dsCard group="Forms" height=250 subtitle="Email capture with inline submit, and an error" -->
<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TextField</title>
<style>body{padding:24px;box-sizing:border-box;background:var(--surface)} .wrap{max-width:520px} .wrap+.wrap{margin-top:24px}</style></head>
<body>
<div class="wrap">
  <label class="hl-label-text" for="e">Work email</label>
  <div class="hl-field"><input id="e" class="hl-input" type="email" placeholder="you@example.com"><button class="hl-btn hl-btn--primary">Continue</button></div>
  <p class="hl-hint">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
</div>
<div class="wrap">
  <label class="hl-label-text" for="t">Team name</label>
  <div class="hl-field"><input id="t" class="hl-input hl-input--strong" value="Ops" aria-invalid="true" aria-describedby="t-err"></div>
  <p class="hl-hint hl-hint--error" id="t-err">Error: use at least three characters.</p>
</div>
</body></html>
