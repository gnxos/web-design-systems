<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Input</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script></head>
<body>
<div class="gl-stage"><div class="gl-composer"><textarea aria-label="Ask for a change" placeholder="Tell it what needs doing"></textarea><div class="gl-composer__bar"><button class="gl-round" aria-label="Attach"><svg class="gl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><button class="gl-round gl-round--go" aria-label="Send"><svg class="gl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></div><div class="gl-row" style="margin-top:24px;align-items:flex-start"><label class="gl-field">Work email<input type="email" placeholder="you@yourplace.com"><small>We reply within a day.</small></label><label class="gl-field">Team size<input aria-invalid="true" value="many"><small>Enter a number.</small></label></div></div>
<script>Gridlight.init();</script>
</body>
</html>
