<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chip</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script></head>
<body>
<div class="gl-stage"><p class="gl-cap">Filter chips</p><div class="gl-row" data-chips><button class="gl-chip" aria-pressed="true"><svg class="gl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></svg> Stock</button><button class="gl-chip" aria-pressed="false"><svg class="gl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg> Shifts</button><button class="gl-chip" aria-pressed="false"><svg class="gl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></svg> Paperwork</button><button class="gl-chip is-hover" aria-pressed="false"><svg class="gl-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg> Layout</button></div><p class="gl-cap">Tags and status</p><div class="gl-row"><span class="gl-tag gl-tag--warm">Workshop</span><span class="gl-tag">Draft</span><span class="gl-tag gl-tag--up">+12 today</span><span class="gl-tag gl-tag--down">-3 late</span><span class="gl-status">All systems normal</span></div></div>
<script>Gridlight.init();</script>
</body>
</html>
