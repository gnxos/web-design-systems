<!-- @dsCard group="Layout" height=300 subtitle="Sticky uppercase tabs with scroll-linked underline" -->
<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{padding:24px;box-sizing:border-box}</style></head>
<body>
<div style="display:flex;gap:40px;width:100%;align-items:flex-start"><div class="cr-tabs"><div class="cr-progress"><i style="width:40%"></i></div><button class="cr-tab" aria-current="true" style="--progress:40%">Plan the work</button><button class="cr-tab">Watch the budget</button><button class="cr-tab">Keep clients close</button></div><div style="flex:1;min-width:0"><h3 class="cr-h2">Turn a plan into steady progress</h3><p class="cr-body" style="margin-top:16px;max-width:36em">The active tab shows an ink underline that fills as the section scrolls. Inactive tabs use the safe muted tone.</p></div></div>
<script>Cirrus.init();</script>
</body>
</html>
