<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<section class="ht-photo ht-scanlines" style="background-image:url(../../assets/Graphics/warm-backdrop.svg);padding:28px;border-radius:32px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative;z-index:1">
    <div class="ht-glass" style="padding:22px"><h3 class="ht-h2" style="font-size:28px">Reach</h3><p class="ht-body" style="color:#ffffffcc;margin:10px 0 16px">Calls connect and emails land, reliably and at scale.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="ht-tag ht-tag--smoke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg> Dialer</span><span class="ht-tag ht-tag--smoke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Inbox</span></div></div>
    <div class="ht-glass" style="padding:22px"><h3 class="ht-h2" style="font-size:28px">Context</h3><p class="ht-body" style="color:#ffffffcc;margin:10px 0 16px">History, signals and notes in one view.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="ht-tag ht-tag--smoke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg> Signals</span><span class="ht-tag ht-tag--smoke">Memory</span></div></div>
    <div class="ht-glass" style="padding:22px"><h3 class="ht-h2" style="font-size:28px">Learning</h3><p class="ht-body" style="color:#ffffffcc;margin:10px 0 16px">Every interaction makes the next one better.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="ht-tag ht-tag--smoke">Grading</span><span class="ht-tag ht-tag--smoke">Evals</span></div></div>
  </div>
</section>
