<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{padding:20px;box-sizing:border-box}body{background:#fff}</style></head>
<body>

<div class="ht-card" style="display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px">
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="ht-card__title"><span class="ht-dot"></span><h3 class="ht-h3">Spot the right accounts early.</h3></div>
    <p class="ht-lead" style="color:#0f0f0f">See who is ready to talk, rank them, and reach out while interest is high.</p>
    <ul class="ht-plus-list"><li>Enrichment</li><li>Data and signals</li><li>Routing</li></ul>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px"><span class="ht-stat" style="font-size:52px">3x</span><span class="ht-tag ht-tag--mint" style="align-self:flex-start">More meetings booked</span></div>
  </div>
  <div class="ht-photo" style="background-image:url(../../assets/Graphics/warm-backdrop.svg);min-height:340px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:18px">
    <div class="ht-ui" style="width:78%"><b style="font-weight:500">Trigger</b><br><span style="color:#5c6b7f">New visit from a target account</span></div>
    <div style="width:2px;height:18px;background:#fb64fa"></div>
    <div class="ht-ui" style="width:78%"><b style="font-weight:500">Research</b> <span class="ht-tag" style="font-size:10px;padding:4px 7px">Account</span><br><span style="color:#5c6b7f">Summarise the last 90 days</span></div>
    <div style="width:2px;height:18px;background:#fb64fa"></div>
    <div class="ht-ui" style="width:78%"><b style="font-weight:500">Draft email</b> <span class="ht-tag ht-tag--mint" style="font-size:10px;padding:4px 7px">Ready</span></div>
  </div>
</div>
<script></script>
</body>
</html>
