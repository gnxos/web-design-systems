<!doctype html>
<html data-theme="dark">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 960px; height: 288px; overflow: hidden; background: var(--canvas, #0a0a0a); }
  .cv { position: relative; width: 960px; height: 288px; }
  .cv svg { position: absolute; inset: 0; }
  .ember { fill: var(--ember, #eb4304); } .teal { fill: var(--teal, #236571); } .sand { fill: var(--sand, #ceb8ad); }
  .blk { rx: var(--radius-xl, 12px); }
  .cut { fill: var(--canvas, #0a0a0a); }
  .txt { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-sans, "Geist", system-ui, sans-serif); font-weight: 500; font-size: 76px; line-height: 0.92; letter-spacing: -0.045em; color: var(--ink, #f5f5f5); }
  .tag { margin: 14px 0 0; font-family: var(--font-sans, "Geist", system-ui, sans-serif); font-size: 14px; line-height: 20px; color: var(--muted, #a3a3a3); }

<body>
<div class="cv">

      scales: pitch space-3 x2, gaps space-4, corners radius-xl
    -->
    <rect class="ember blk" x="536" y="-20" width="200" height="232"/>
