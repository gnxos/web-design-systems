<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 288px; width: 960px; overflow: hidden; background: var(--surface, #fff); }
  .cv { position: relative; width: 960px; height: 288px; }
  .cv svg { position: absolute; inset: 0; }
  .powder { fill: var(--powder, #bfd9e3); }
  .powder50 { fill: var(--powder-50, #dfecf1); }
  .ink { fill: var(--ink, #000); }
  .blk { rx: var(--radius-l, 20px); }
  .spark-paper { fill: var(--surface, #fff); stroke: var(--line-strong, #000); stroke-width: var(--stroke-line, 1px); }
  .spark-ink { fill: var(--ink, #000); }
  .spark-powder { fill: var(--powder, #bfd9e3); stroke: var(--on-powder, #000); stroke-width: var(--stroke-line, 1px); }
  .txt { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { font-family: var(--font-sans, "Archivo", sans-serif); font-weight: 800; font-stretch: 108%; font-size: 96px; line-height: 0.92; color: var(--ink, #000); margin: 0; letter-spacing: -0.01em; }
  .tag { font-family: var(--font-sans, "Archivo", sans-serif); font-size: 14px; font-weight: 500; line-height: 20px; color: var(--ink, #000); margin: 12px 0 0; }
</style></head>
<body>
<div class="cv">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!--
      blocks: powder 260×248 slab (radius-l), ink 150×200 (radius-l), powder-50 130×110 (radius-l) — powder leads, ink anchors, powder-50 relieves
      arrangement: one tall powder slab bleeding off the top, an ink block bleeding off the right, a powder-50 satellite bleeding off the bottom; all right of x=480
      pattern: literal motif row — the four-point sparkle is the system's AI/insight sign and its most specific shape; 7 sparkles in paper, ink and powder
      scales: gaps = space-gutter 20px multiples, corners = radius-l 20px, sparkle outline = stroke-line 1px
    -->
    <rect class="powder blk" x="560" y="-20" width="260" height="248"/>
    <rect class="ink blk" x="840" y="48" width="150" height="200"/>
    <rect class="powder50 blk" x="500" y="208" width="130" height="110"/>
    <path class="spark-paper" transform="translate(690 100)" d="M0 -58 C10 -18 18 -10 58 0 C18 10 10 18 0 58 C-10 18 -18 10 -58 0 C-18 -10 -10 -18 0 -58Z"/>
    <path class="spark-ink" transform="translate(612 40)" d="M0 -18 C3 -6 6 -3 18 0 C6 3 3 6 0 18 C-3 6 -6 3 -18 0 C-6 -3 -3 -6 0 -18Z"/>
    <path class="spark-paper" transform="translate(782 182)" d="M0 -24 C4 -8 8 -4 24 0 C8 4 4 8 0 24 C-4 8 -8 4 -24 0 C-8 -4 -4 -8 0 -24Z"/>
    <path class="spark-powder" transform="translate(900 120)" d="M0 -36 C6 -11 11 -6 36 0 C11 6 6 11 0 36 C-6 11 -11 6 -36 0 C-11 -6 -6 -11 0 -36Z"/>
    <path class="spark-powder" transform="translate(880 210)" d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14Z"/>
    <path class="spark-ink" transform="translate(566 254)" d="M0 -16 C3 -5 5 -3 16 0 C5 3 3 5 0 16 C-3 5 -5 3 -16 0 C-5 -3 -3 -5 0 -16Z"/>
    <path class="spark-paper" transform="translate(860 26)" d="M0 -14 C2 -4 4 -2 14 0 C4 2 2 4 0 14 C-2 4 -4 2 -14 0 C-4 -2 -2 -4 0 -14Z"/>
  </svg>
  <div class="txt">
    <p class="name">Inkwell</p>
    <p class="tag">Ink line, powder blue and hand-drawn doodles — precise, but human.</p>
  </div>
</div>
</body>
</html>
