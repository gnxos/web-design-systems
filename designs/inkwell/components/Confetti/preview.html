<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{padding:24px;box-sizing:border-box}body{padding:0}</style></head>

<section class="ik-block ik-block--powder" data-ik-confetti="14" data-seed="5" style="padding:90px 20px;min-height:320px;box-sizing:border-box">

    <div style="display:flex;gap:16px;justify-content:center;margin-top:28px;flex-wrap:wrap"><a class="ik-btn ik-btn--lg ik-btn--primary" href="#" style="min-width:200px;height:52px">Get started</a><a class="ik-btn ik-btn--lg ik-btn--outline" href="#" style="min-width:200px;height:52px">See how it works</a></div>
  </div>
