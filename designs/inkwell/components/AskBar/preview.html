<!-- @dsCard group="Inputs" height=200 subtitle="AI prompt with glow and sparkle" -->
<!doctype html>
<html data-theme="light">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><script>(function(){var m=location.search.match(/theme=([\w-]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{padding:24px;box-sizing:border-box}</style></head>
<body>

<div style="padding:56px 24px 24px;display:flex;justify-content:center">
  <form class="ik-ask" onsubmit="return false">
    <span class="ik-ask__spark" data-ik-doodle="sparkle-powder" data-size="32" data-motion="twinkle"></span>
    <label for="q" style="position:absolute;left:-9999px">Ask a question</label>
    <input id="q" placeholder="What changed in last week's numbers?">
    <button aria-label="Send">&uarr;</button>
  </form>
</div>
<script>Inkwell.init();</script>
</body>
</html>
